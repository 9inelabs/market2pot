<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Notifications</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Notifications</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><span style="font-size:14px;font-weight:500;color:#2A2420;">Notifications</span></div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:6px;">TODAY</div>
<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:30px;height:30px;border-radius:9px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-clipboard-list" style="font-size:14px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10px;color:#2A2420;">New order from <span style="font-weight:500;">Chidinma Adeyemi</span></div><div style="font-size:8px;color:#6B5D4F;margin-top:1px;">10 minutes ago</div></div>
</div>
<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:14px;">
<div style="width:30px;height:30px;border-radius:9px;background:#F9E8C8;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-alert-triangle" style="font-size:14px;color:#8A6417"></i></div>
<div style="flex:1;"><div style="font-size:10px;color:#2A2420;"><span style="font-weight:500;">Fresh tomatoes</span> is running low on stock</div><div style="font-size:8px;color:#6B5D4F;margin-top:1px;">1 hour ago</div></div>
</div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:6px;">EARLIER</div>
<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:30px;height:30px;border-radius:9px;background:#F4E4D4;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-star" style="font-size:14px;color:#A35A2E"></i></div>
<div style="flex:1;"><div style="font-size:10px;color:#2A2420;"><span style="font-weight:500;">Blessing Kalu</span> left a 5-star review</div><div style="font-size:8px;color:#6B5D4F;margin-top:1px;">Yesterday</div></div>
</div>
<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;">
<div style="width:30px;height:30px;border-radius:9px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-shield-check" style="font-size:14px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10px;color:#2A2420;">Your verification is <span style="font-weight:500;">3 of 4</span> steps complete</div><div style="font-size:8px;color:#6B5D4F;margin-top:1px;">2 days ago</div></div>
</div>

</div>
</body>
</html>
