<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Business Settings</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Business Settings</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><span style="font-size:14px;font-weight:500;color:#2A2420;">Business settings</span></div>

<div style="display:flex;align-items:center;justify-content:space-between;background:#EAF1EC;border:0.5px solid #C7DBCB;border-radius:12px;padding:11px;margin-bottom:16px;">
<div style="display:flex;align-items:center;gap:8px;"><span style="width:8px;height:8px;border-radius:50%;background:#3F7A52;"></span><span style="font-size:11px;font-weight:500;color:#2A2420;">Currently open for orders</span></div>
<span style="width:26px;height:15px;border-radius:8px;background:#3F7A52;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;right:1.5px;width:12px;height:12px;border-radius:50%;background:#FFFFFF;"></span></span>
</div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:4px;">DELIVERY</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:14px;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-map-pins" style="font-size:15px;color:#3F7A52"></i><div><div style="font-size:11px;color:#2A2420;">Delivery zones & fees</div><div style="font-size:8px;color:#6B5D4F;">3 zones set up</div></div></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:4px;">AVAILABILITY</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:14px;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-clock" style="font-size:15px;color:#3F7A52"></i><div><div style="font-size:11px;color:#2A2420;">Business hours</div><div style="font-size:8px;color:#6B5D4F;">Mon &ndash; Sat, 8am &ndash; 6pm</div></div></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:4px;">TRUST</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-shield-check" style="font-size:15px;color:#3F7A52"></i><div><div style="font-size:11px;color:#2A2420;">Verification progress</div><div style="font-size:8px;color:#6B5D4F;">3 of 4 steps complete</div></div></div><div style="display:flex;align-items:center;gap:6px;"><span style="font-size:8px;padding:2px 7px;border-radius:8px;background:#F9E8C8;color:#8A6417;">3/4</span><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div></div>

</div>
</body>
</html>
