<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Add / Edit Product</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Add / Edit Product</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><span style="font-size:14px;font-weight:500;color:#2A2420;">Add product</span></div>

<div style="font-size:9px;color:#6B5D4F;margin-bottom:6px;">Photos</div>
<div style="display:flex;gap:7px;margin-bottom:14px;">
<div style="width:52px;height:52px;background:#EAF1EC;border-radius:9px;display:flex;align-items:center;justify-content:center;"><i class="ti ti-photo" style="font-size:17px;color:#3F7A52"></i></div>
<div style="width:52px;height:52px;background:#EAF1EC;border-radius:9px;display:flex;align-items:center;justify-content:center;"><i class="ti ti-photo" style="font-size:17px;color:#3F7A52"></i></div>
<div style="width:52px;height:52px;background:#EAF1EC;border-radius:9px;display:flex;align-items:center;justify-content:center;"><i class="ti ti-photo" style="font-size:17px;color:#3F7A52"></i></div>
<div style="width:52px;height:52px;border:1px dashed #C9BBA3;border-radius:9px;display:flex;align-items:center;justify-content:center;"><i class="ti ti-camera" style="font-size:16px;color:#6B5D4F"></i></div>
</div>

<div style="margin-bottom:10px;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Product name</div><input placeholder="e.g. Fresh tomatoes" style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;" /></div>

<div style="margin-bottom:10px;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Category</div><select style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;"><option>Vegetables</option></select></div>

<div style="display:flex;gap:8px;margin-bottom:10px;">
<div style="flex:1;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Price (&#8358;)</div><input placeholder="1200" style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;" /></div>
<div style="flex:1;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Unit</div><select style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;"><option>Per basket</option></select></div>
</div>

<div style="display:flex;gap:8px;margin-bottom:10px;">
<div style="flex:1;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Quantity available</div><input placeholder="20" style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;" /></div>
<div style="flex:1;"><div style="font-size:9px;color:#6B5D4F;margin-bottom:5px;">Low-stock alert</div><input placeholder="5" style="width:100%;font-size:10.5px;border:0.5px solid #E3D9C8;border-radius:10px;padding:8px 10px;background:#FFFDF8;color:#2A2420;box-sizing:border-box;" /></div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:10px;padding:9px 11px;margin-bottom:10px;">
<div style="display:flex;align-items:center;gap:8px;"><i class="ti ti-calendar-event" style="font-size:15px;color:#3F7A52"></i><span style="font-size:10px;color:#2A2420;">Harvest date</span></div>
<span style="font-size:9.5px;color:#6B5D4F;">Today &rsaquo;</span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:10px;padding:9px 11px;margin-bottom:16px;">
<div><div style="font-size:10px;color:#2A2420;">Available for pre-order</div><div style="font-size:8px;color:#6B5D4F;">Let households order before harvest</div></div>
<span style="width:26px;height:15px;border-radius:8px;background:#3F7A52;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;right:1.5px;width:12px;height:12px;border-radius:50%;background:#FFFFFF;"></span></span>
</div>

<button type="button" style="width:100%;background:#3F7A52;color:#FFFFFF;border:none;border-radius:20px;padding:10px;font-size:11px;font-weight:500;">Publish listing</button>

</div>
</body>
</html>
