<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Profile Tab</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Profile Tab</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="text-align:center;margin-bottom:14px;">
<div style="width:60px;height:60px;border-radius:50%;background:#EAF1EC;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;"><i class="ti ti-leaf" style="font-size:26px;color:#3F7A52"></i></div>
<div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:3px;"><span style="font-size:13px;font-weight:500;color:#2A2420;">Ngozi's Poultry Farm</span><i class="ti ti-rosette-discount-check" style="font-size:12px;color:#3F7A52"></i></div>
<span style="font-size:9px;color:#3F7A52;">View public profile &rsaquo;</span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;background:#EAF1EC;border:0.5px solid #C7DBCB;border-radius:12px;padding:11px;margin-bottom:16px;">
<div style="display:flex;align-items:center;gap:9px;"><div style="width:30px;height:30px;border-radius:9px;background:#3F7A52;display:flex;align-items:center;justify-content:center;"><i class="ti ti-arrows-exchange" style="font-size:15px;color:#FFFFFF"></i></div><div><div style="font-size:10.5px;font-weight:500;color:#2A2420;">Switch to Shopping view</div><div style="font-size:8px;color:#6B5D4F;">Browse and order as a household</div></div></div>
<i class="ti ti-chevron-right" style="font-size:13px;color:#3F7A52"></i>
</div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:4px;">FARM</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-user-edit" style="font-size:15px;color:#3F7A52"></i><span style="font-size:11px;color:#2A2420;">Edit profile</span></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-building-store" style="font-size:15px;color:#3F7A52"></i><span style="font-size:11px;color:#2A2420;">Business settings</span></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:14px;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-building-bank" style="font-size:15px;color:#3F7A52"></i><span style="font-size:11px;color:#2A2420;">Bank details</span></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>

<div style="font-size:9px;color:#6B5D4F;letter-spacing:0.5px;margin-bottom:4px;">GENERAL</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-settings" style="font-size:15px;color:#3F7A52"></i><span style="font-size:11px;color:#2A2420;">App settings</span></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:14px;"><div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-help-circle" style="font-size:15px;color:#3F7A52"></i><span style="font-size:11px;color:#2A2420;">Help & Support</span></div><i class="ti ti-chevron-right" style="font-size:13px;color:#C9BBA3"></i></div>

<div style="display:flex;align-items:center;gap:9px;padding:10px 0;"><i class="ti ti-logout" style="font-size:15px;color:#2A2420"></i><span style="font-size:11px;color:#2A2420;">Log out</span></div>

</div>
</body>
</html>
