<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Order Detail</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Orders — Detail</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><span style="font-size:14px;font-weight:500;color:#2A2420;">Order #A2481</span></div>

<div style="display:flex;align-items:center;margin-bottom:16px;">
<div style="flex:1;text-align:center;"><div style="width:9px;height:9px;border-radius:50%;background:#3F7A52;margin:0 auto 4px;"></div><span style="font-size:7px;color:#2A2420;">Placed</span></div>
<div style="flex:1;height:2px;background:#3F7A52;margin-bottom:14px;"></div>
<div style="flex:1;text-align:center;"><div style="width:9px;height:9px;border-radius:50%;background:#3F7A52;margin:0 auto 4px;"></div><span style="font-size:7px;color:#2A2420;font-weight:500;">Preparing</span></div>
<div style="flex:1;height:2px;background:#D9CDBB;margin-bottom:14px;"></div>
<div style="flex:1;text-align:center;"><div style="width:9px;height:9px;border-radius:50%;background:#D9CDBB;margin:0 auto 4px;"></div><span style="font-size:7px;color:#6B5D4F;">Out for delivery</span></div>
<div style="flex:1;height:2px;background:#D9CDBB;margin-bottom:14px;"></div>
<div style="flex:1;text-align:center;"><div style="width:9px;height:9px;border-radius:50%;background:#D9CDBB;margin:0 auto 4px;"></div><span style="font-size:7px;color:#6B5D4F;">Delivered</span></div>
</div>

<div style="background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:12px;padding:11px;margin-bottom:12px;">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span style="font-size:11px;font-weight:500;color:#2A2420;">Chidinma Adeyemi</span><i class="ti ti-phone" style="font-size:14px;color:#3F7A52"></i></div>
<div style="display:flex;align-items:center;gap:6px;"><i class="ti ti-truck" style="font-size:12px;color:#6B5D4F"></i><span style="font-size:9px;color:#6B5D4F;">14 Admiralty Way, Lekki Phase 1</span></div>
</div>

<div style="font-size:10px;font-weight:500;color:#2A2420;margin-bottom:8px;">Items</div>
<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid #EDE4D3;"><span style="font-size:10px;color:#2A2420;">Fresh tomatoes &times;2</span><span style="font-size:10px;color:#2A2420;">&#8358;2,400</span></div>
<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid #EDE4D3;margin-bottom:8px;"><span style="font-size:10px;color:#2A2420;">Yam tubers &times;1</span><span style="font-size:10px;color:#2A2420;">&#8358;800</span></div>
<div style="display:flex;justify-content:space-between;margin-bottom:16px;"><span style="font-size:11px;font-weight:500;color:#2A2420;">Total</span><span style="font-size:11px;font-weight:500;color:#2A2420;">&#8358;3,200</span></div>

<button type="button" style="width:100%;background:#3F7A52;color:#FFFFFF;border:none;border-radius:20px;padding:10px;font-size:11px;font-weight:500;">Mark out for delivery</button>

</div>
</body>
</html>
