<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — My Listings</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">My Listings</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
<div style="display:flex;align-items:center;gap:9px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><span style="font-size:14px;font-weight:500;color:#2A2420;">My Listings</span></div>
<i class="ti ti-plus" style="font-size:17px;color:#3F7A52"></i>
</div>
<div style="text-align:right;margin-bottom:10px;"><span style="font-size:9px;color:#3F7A52;">Select</span></div>

<div style="display:flex;align-items:center;justify-content:space-between;background:#2A2420;border-radius:12px;padding:9px 11px;margin-bottom:10px;">
<span style="font-size:9.5px;color:#F7F1E6;">2 selected</span>
<div style="display:flex;gap:10px;"><span style="font-size:8.5px;color:#F7F1E6;">Update price</span><span style="font-size:8.5px;color:#F7F1E6;">Toggle availability</span></div>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:15px;height:15px;border-radius:4px;background:#3F7A52;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-check" style="font-size:10px;color:#FFFFFF"></i></div>
<div style="width:34px;height:34px;border-radius:8px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;"><i class="ti ti-apple" style="font-size:16px;color:#3F7A52"></i><span style="position:absolute;bottom:-3px;right:-3px;background:#2A2420;color:#F7F1E6;font-size:6.5px;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;">3</span></div>
<div style="flex:1;"><div style="font-size:10px;font-weight:500;color:#2A2420;">Fresh tomatoes</div><div style="font-size:8px;color:#6B5D4F;margin-bottom:2px;">&#8358;1,200 / basket</div><span style="font-size:7px;padding:2px 6px;border-radius:8px;background:#F9E8C8;color:#8A6417;">Low stock: 2 left</span></div>
<span style="width:24px;height:14px;border-radius:7px;background:#3F7A52;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;right:1.5px;width:11px;height:11px;border-radius:50%;background:#FFFFFF;"></span></span>
<i class="ti ti-pencil" style="font-size:12px;color:#6B5D4F;flex-shrink:0;"></i>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:15px;height:15px;border-radius:4px;background:#3F7A52;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-check" style="font-size:10px;color:#FFFFFF"></i></div>
<div style="width:34px;height:34px;border-radius:8px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;"><i class="ti ti-egg" style="font-size:16px;color:#3F7A52"></i><span style="position:absolute;bottom:-3px;right:-3px;background:#2A2420;color:#F7F1E6;font-size:6.5px;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;">5</span></div>
<div style="flex:1;"><div style="font-size:10px;font-weight:500;color:#2A2420;">Free-range eggs</div><div style="font-size:8px;color:#6B5D4F;margin-bottom:2px;">&#8358;2,500 / crate</div><span style="font-size:7px;padding:2px 6px;border-radius:8px;background:#F4E4D4;color:#A35A2E;">20% OFF</span></div>
<span style="width:24px;height:14px;border-radius:7px;background:#3F7A52;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;right:1.5px;width:11px;height:11px;border-radius:50%;background:#FFFFFF;"></span></span>
<i class="ti ti-pencil" style="font-size:12px;color:#6B5D4F;flex-shrink:0;"></i>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:15px;height:15px;border-radius:4px;border:1px solid #C9BBA3;flex-shrink:0;"></div>
<div style="width:34px;height:34px;border-radius:8px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-carrot" style="font-size:16px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10px;font-weight:500;color:#2A2420;">Yam tubers</div><div style="font-size:8px;color:#6B5D4F;">&#8358;800 / tuber</div></div>
<span style="width:24px;height:14px;border-radius:7px;background:#D9CDBB;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;left:1.5px;width:11px;height:11px;border-radius:50%;background:#FFFFFF;"></span></span>
<i class="ti ti-pencil" style="font-size:12px;color:#6B5D4F;flex-shrink:0;"></i>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:9px 0;">
<div style="width:15px;height:15px;border-radius:4px;border:1px solid #C9BBA3;flex-shrink:0;"></div>
<div style="width:34px;height:34px;border-radius:8px;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-leaf" style="font-size:16px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10px;font-weight:500;color:#2A2420;">Ripe plantain</div><div style="font-size:8px;color:#6B5D4F;">&#8358;600 / bunch</div></div>
<span style="width:24px;height:14px;border-radius:7px;background:#3F7A52;position:relative;display:inline-block;flex-shrink:0;"><span style="position:absolute;top:1.5px;right:1.5px;width:11px;height:11px;border-radius:50%;background:#FFFFFF;"></span></span>
<i class="ti ti-pencil" style="font-size:12px;color:#6B5D4F;flex-shrink:0;"></i>
</div>

</div>
</body>
</html>
