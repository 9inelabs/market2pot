<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Chat Thread</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Messages — Chat Thread</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;height:400px;">

<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;"><i class="ti ti-arrow-left" style="font-size:16px;color:#2A2420"></i><div style="width:28px;height:28px;border-radius:50%;background:#EAF1EC;display:flex;align-items:center;justify-content:center;"><i class="ti ti-user" style="font-size:13px;color:#3F7A52"></i></div><span style="font-size:12px;font-weight:500;color:#2A2420;">Chidinma Adeyemi</span></div>

<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;margin-bottom:12px;">
<div style="align-self:flex-start;max-width:75%;background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:12px 12px 12px 3px;padding:8px 11px;"><span style="font-size:10px;color:#2A2420;">Hi, is the delivery still coming today?</span></div>
<div style="align-self:flex-end;max-width:75%;background:#3F7A52;border-radius:12px 12px 3px 12px;padding:8px 11px;"><span style="font-size:10px;color:#FFFFFF;">Yes! Out for delivery within the hour &#127807;</span></div>
<div style="align-self:flex-start;max-width:75%;background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:12px 12px 12px 3px;padding:8px 11px;"><span style="font-size:10px;color:#2A2420;">Perfect, thank you!</span></div>
</div>

<div style="display:flex;align-items:center;gap:8px;background:#FFFDF8;border:0.5px solid #E3D9C8;border-radius:20px;padding:8px 8px 8px 14px;">
<span style="flex:1;font-size:10px;color:#6B5D4F;">Type a message</span>
<div style="width:26px;height:26px;border-radius:50%;background:#3F7A52;display:flex;align-items:center;justify-content:center;"><i class="ti ti-send" style="font-size:12px;color:#FFFFFF"></i></div>
</div>

</div>
</body>
</html>
