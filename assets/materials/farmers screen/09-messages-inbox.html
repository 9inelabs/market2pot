<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;font-family:"Inter",sans-serif;background:#EDE6D6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh;}</style>
<title>Market2pot — Messages Inbox</title>
</head>
<body>
<div style="font-size:13px;font-weight:500;color:#2A2420;margin-bottom:16px;">Messages — Inbox</div>
<div style="width:320px;background:#F7F1E6;border:0.5px solid #D9CDBB;border-radius:28px;padding:14px;box-sizing:border-box;">

<div style="font-size:14px;font-weight:500;color:#2A2420;margin-bottom:14px;">Messages</div>

<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:36px;height:36px;border-radius:50%;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-user" style="font-size:16px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10.5px;font-weight:500;color:#2A2420;">Chidinma Adeyemi</div><div style="font-size:8.5px;color:#6B5D4F;">Is the delivery still coming today?</div></div>
<div style="text-align:right;"><div style="font-size:7.5px;color:#6B5D4F;margin-bottom:3px;">10m</div><span style="width:7px;height:7px;border-radius:50%;background:#C97C4B;display:inline-block;"></span></div>
</div>

<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:36px;height:36px;border-radius:50%;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-user" style="font-size:16px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10.5px;font-weight:500;color:#2A2420;">Tunde Okafor</div><div style="font-size:8.5px;color:#6B5D4F;">You: Sure, I'll set aside a fresh crate</div></div>
<div style="font-size:7.5px;color:#6B5D4F;">2h</div>
</div>

<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #EDE4D3;">
<div style="width:36px;height:36px;border-radius:50%;background:#EAF1EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-user" style="font-size:16px;color:#3F7A52"></i></div>
<div style="flex:1;"><div style="font-size:10.5px;font-weight:500;color:#2A2420;">Blessing Kalu</div><div style="font-size:8.5px;color:#6B5D4F;">Thank you, everything arrived well</div></div>
<div style="font-size:7.5px;color:#6B5D4F;">Yesterday</div>
</div>

</div>
</body>
</html>
